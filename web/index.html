<!DOCTYPE html>
<!-- Kerangka dashboard. Tiap halaman menu ada di web/views/<nama>.html dan disisipkan di baris "@view <nama>".
     public/index.html dirakit dari sini oleh scripts/build-html.mjs (otomatis saat wrangler dev / deploy). -->
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tomo Joyo Marketing</title>
<link rel="icon" type="image/png" sizes="32x32" href="/asset/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/asset/icon-192.png">
<link rel="apple-touch-icon" href="/asset/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0a3d91">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">

<body>
<!-- Halaman login: tampil saat API menjawab 401 (belum login / sesi habis) -->
<div class="login" id="login" hidden>
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="login-brand"><img class="mark" src="/asset/icon-192.png" alt="TMJ Marketing"><div><b>Tomo Joyo Marketing</b><small>Dashboard penjualan</small></div></div>
    <h1>Masuk</h1>
    <p>Masukkan username dan password dashboard.</p>
    <label>Username<input name="username" id="loginUser" autocomplete="username" required autocapitalize="off" spellcheck="false"></label>
    <label>Password<span class="login-pw"><input name="password" id="loginPw" type="password" autocomplete="current-password" required><button type="button" id="loginLihat" aria-label="Tampilkan password">Lihat</button></span></label>
    <div class="login-msg" id="loginMsg" role="alert"></div>
    <button type="submit" class="btn primary" id="loginBtn">Masuk</button>
  </form>
</div>
<div class="app">
  <aside class="side">
    <div class="brand">
      <img class="mark" src="/asset/icon-192.png" alt="TMJ Marketing">
      <div><b>Tomo Joyo Marketing</b></div>
      <button type="button" class="ciut" id="sideCiut" aria-label="Ciutkan menu" title="Ciutkan menu" aria-expanded="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    </div>
    <nav class="nav" id="nav">
      <button class="active" data-view="ringkasan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span class="l">Ringkasan</span><span class="s">Ringkasan</span></button>
      <button data-view="iklansemua"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg><span class="l">Spending Iklan</span><span class="s">Spending</span></button>
      <div class="grp" data-group="iklan">
        <button class="par" data-view="iklan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h6M4 6h12M4 18h9"/><circle cx="18" cy="12" r="3"/></svg><span class="l">Iklan Meta</span><span class="s">Meta</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg></button>
        <div class="sub">
          <button data-view="iklan"><span class="l">Campaign &amp; Ad</span><span class="s">Campaign</span></button>
          <button data-view="konten"><span class="l">Konten</span><span class="s">Konten</span></button>
          <button data-view="dataproduk"><span class="l">Produk Iklan</span><span class="s">Produk</span></button>
        </div>
      </div>
      <div class="grp" data-group="order">
        <button class="par" data-view="pesanan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg><span class="l">Order</span><span class="s">Order</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg></button>
        <div class="sub">
          <button data-view="pesanan"><span class="l">Scalev</span><span class="s">Scalev</span></button>
          <button data-view="lead"><span class="l">Performa Lead</span><span class="s">Lead</span></button>
        </div>
      </div>
      <div class="grp" data-group="produk">

        </div>
      </div>

          <button data-view="inrts"><span class="l">Inbound RTS</span><span class="s">RTS</span><b class="badge" id="navRts" hidden></b></button>
        </div>
      </div>
      <div class="grp" data-group="kirim">
        <button class="par" data-view="mengantar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg><span class="l">Pengiriman</span><span class="s">Kirim</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg></button>
        <div class="sub">
          <button data-view="mengantar"><span class="l">Ringkasan Paket</span><span class="s">Paket</span></button>

          <button data-view="persediaan"><span class="l">Nilai Persediaan</span><span class="s">Persediaan</span></button>
        </div>
      </div>
    </nav>
    <div class="foot">
      <button class="sync" data-sync><svg id="syncIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg><span class="lbl">Sinkron sekarang</span></button>
      <div id="syncFoot"><span class="dot off"></span>Memuat status…</div>
    </div>
    <div class="akun-m">
      <div class="akun-pop" id="akunPop" role="menu" hidden>
        <button type="button" class="akun-it khusus-admin" data-akun-buka="users" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg>Manajemen User</button>
        <button type="button" class="akun-it" data-akun-buka="pengaturan" id="akunPengaturan" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="var(--card)"/><circle cx="15" cy="12" r="2" fill="var(--card)"/><circle cx="8" cy="18" r="2" fill="var(--card)"/></svg>Pengaturan dashboard<b class="badge cf-badge" hidden></b></button>
        <button type="button" class="akun-it khusus-db" data-gantipw role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Ganti password</button>
        <div class="akun-sep"></div>
        <button type="button" class="akun-it" data-keluar role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>Logout</button>
      </div>
      <button type="button" class="akun-chip" id="akunChip" aria-haspopup="menu" aria-expanded="false" aria-controls="akunPop">
        <span class="akun-av" id="akunAv">·</span><b class="badge cf-badge akun-badge" hidden></b><span class="akun-tx"><b id="akunNama">—</b><small id="akunPeran">—</small></span>
      </button>
