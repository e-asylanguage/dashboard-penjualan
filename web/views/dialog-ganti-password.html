
    <!-- ================= DIALOG GANTI PASSWORD (menu akun) — js/main.js ================= -->
    <dialog class="rinci sku-dlg" id="usPwDlg" aria-labelledby="usPwJ">
      <form class="rinci-in" id="usPwForm" method="dialog">
        <div class="rinci-h"><h3 id="usPwJ">Ganti password</h3><button type="button" class="rinci-x" id="usPwTutup" aria-label="Tutup">×</button></div>
        <div class="sku-f">
          <label class="w2">Password lama<span class="login-pw"><input name="lama" type="password" required autocomplete="current-password"><button type="button" data-lihat-pw aria-label="Tampilkan password">Lihat</button></span></label>
          <label>Password baru<span class="login-pw"><input name="baru" type="password" required minlength="8" autocomplete="new-password" placeholder="Minimal 8 karakter"><button type="button" data-lihat-pw aria-label="Tampilkan password">Lihat</button></span></label>
          <label>Ulangi password baru<span class="login-pw"><input name="ulang" type="password" required minlength="8" autocomplete="new-password"><button type="button" data-lihat-pw aria-label="Tampilkan password">Lihat</button></span></label>
        </div>
        <div class="sku-aksi"><span id="usPwMsg"></span><button type="button" class="btn ghost" id="usPwBatal">Batal</button><button type="submit" class="btn primary" id="usPwSimpan">Simpan</button></div>
      </form>
    </dialog>
